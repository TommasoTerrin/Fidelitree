<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Cashback - Fidelitree</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen p-6 font-sans">
    <div class="max-w-sm mx-auto space-y-6">

        {% if merchant.type == 'test' %}
        <div class="bg-yellow-100 text-yellow-800 text-xs font-bold text-center py-2 uppercase tracking-widest rounded-xl shadow-sm border border-yellow-200">
            Ambiente di Test
        </div>
        {% endif %}

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
            <p class="text-xs text-slate-400 font-bold uppercase mb-2">Stato Carta</p>
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="font-black text-xl text-slate-800">Cliente #{{ card.id.hex[:6] }}</h3>
                    <p class="text-sm text-blue-600 font-bold">€ {{ "%.2f"|format(card.cashback_point) }} Cashback</p>
                </div>
            </div>
        </div>

        <!-- ===================== SEZIONE CASHBACK ===================== -->

        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl text-center border-2 border-blue-500">
            <p class="text-sm font-bold text-blue-600 mb-4 uppercase">Modifica Cashback (€)</p>

            <div class="flex items-center justify-center gap-2 mb-6">
                <span class="text-4xl font-bold text-slate-400">€</span>
                <input type="text" id="cb-input" value="" placeholder="0.00"
                    inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*"
                    class="w-40 text-5xl font-black text-center text-slate-900 bg-transparent focus:outline-none border-b-2 border-slate-200 focus:border-blue-500 transition-colors"
                    oninput="sanitizeCashbackInput(this)">
            </div>

            <button id="btn-cashback" onclick="prepareCashbackOperation(1)"
                class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl text-lg shadow-lg active:scale-95 transition-all">
                AGGIUNGI CASHBACK
            </button>

            <button id="btn-remove-cashback" onclick="prepareCashbackOperation(-1)"
                class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-2xl text-base active:scale-95 transition-transform border border-red-100 mt-3">
                TOGLI CASHBACK
            </button>

            <button id="btn-use-all-cb" onclick="prepareUseAllCashback()"
                class="w-full bg-blue-50 text-blue-600 font-bold py-3 rounded-2xl text-base active:scale-95 transition-transform border border-blue-100 mt-3">
                USA INTERO CASHBACK
            </button>
        </div>

    </div>

    <!-- Modal di conferma -->
    <div id="confirm-modal"
        class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-6 z-50">
        <div id="modal-box" class="bg-white w-full max-w-xs rounded-[2.5rem] p-8 text-center shadow-2xl transition-all">
            <h2 id="modal-title" class="text-xl font-bold text-slate-800 mb-2">Confermi l'azione?</h2>
            <p id="modal-text" class="text-slate-500 mb-8">Stai per procedere con l'aggiornamento.</p>

            <div class="space-y-3">
                <button id="btn-confirm" onclick="submitCashback()"
                    class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-md">SÌ,
                    CONFERMO</button>
                <button onclick="hideModal()"
                    class="w-full bg-slate-100 text-slate-500 font-bold py-4 rounded-xl">ANNULLA</button>
            </div>
        </div>
    </div>

    <!-- Toast di feedback -->
    <div id="toast"
        class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-white font-bold shadow-xl z-50 transition-all">
    </div>

    <script>
        const modal = document.getElementById('confirm-modal');
        const modalBox = document.getElementById('modal-box');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const btnConfirm = document.getElementById('btn-confirm');
        const toast = document.getElementById('toast');
        const cardId = "{{ card.id }}";

        // Saldo corrente per validazione lato client
        const currentCashback = {{ card.cashback_point }};

        let pendingPayload = { cb_points: 0.0 };

        function sanitizeCashbackInput(el) {
            // Permette solo numeri, virgola e punto
            el.value = el.value.replace(/[^0-9.,]/g, '');
        }

        function getCashbackValue() {
            const input = document.getElementById('cb-input');
            if (!input) return 0;
            return parseFloat(input.value.replace(',', '.')) || 0;
        }

        // sign = 1 per aggiungere, -1 per togliere
        function prepareCashbackOperation(sign) {
            const cbVal = getCashbackValue();
            if (cbVal === 0) {
                showToast('Inserisci un importo per procedere', true);
                return;
            }

            const amount = cbVal * sign;

            if (sign < 0 && cbVal > currentCashback) {
                showToast('Non puoi togliere più del saldo attuale', true);
                return;
            }

            pendingPayload = { cb_points: amount };
            resetModalStyle();

            if (sign < 0) {
                const newBalance = currentCashback - cbVal;
                modalTitle.innerText = '⚠️ STAI TOGLIENDO CASHBACK';
                modalTitle.className = 'text-xl font-black text-red-600 mb-2';
                modalText.innerHTML =
                    `Stai per rimuovere <span class="text-2xl font-black text-red-600">€ ${cbVal.toFixed(2)}</span> dalla carta.<br><br>` +
                    `Il saldo passerà da <b>€ ${currentCashback.toFixed(2)}</b> a <b>€ ${newBalance.toFixed(2)}</b>.`;
                modalBox.className = 'bg-white w-full max-w-xs rounded-[2.5rem] p-8 text-center shadow-2xl transition-all border-4 border-red-500';
                btnConfirm.textContent = 'SÌ, TOGLI IL CASHBACK';
                btnConfirm.className = 'w-full bg-red-600 text-white font-bold py-4 rounded-xl shadow-md';
            } else {
                modalTitle.innerText = "Confermi l'aggiunta?";
                modalText.innerHTML = `Stai per aggiungere <span class="text-2xl font-black text-blue-600">€ ${cbVal.toFixed(2)}</span> di Cashback alla carta.`;
                btnConfirm.textContent = 'SÌ, CONFERMO';
            }

            modal.classList.remove('hidden');
        }

        function prepareUseAllCashback() {
            if (currentCashback <= 0) {
                showToast('Il saldo cashback è già a zero', true);
                return;
            }

            pendingPayload = { cb_points: -currentCashback };

            resetModalStyle();
            modalTitle.innerText = '⚠️ FAI ATTENZIONE';
            modalTitle.className = 'text-xl font-black text-red-600 mb-2';
            modalText.innerHTML = `Stai per <b>AZZERARE COMPLETAMENTE</b> il cashback di <br><span class="text-2xl font-black text-slate-900">€ ${currentCashback.toFixed(2)}</span>`;
            btnConfirm.className = 'w-full bg-red-600 text-white font-bold py-4 rounded-xl shadow-md';
            btnConfirm.textContent = 'SÌ, CONFERMO';

            modal.classList.remove('hidden');
        }

        // ===================== MODAL & UTILITIES =====================

        function resetModalStyle() {
            modalBox.className = 'bg-white w-full max-w-xs rounded-[2.5rem] p-8 text-center shadow-2xl transition-all';
            btnConfirm.className = 'w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-md';
            modalTitle.innerText = "Confermi l'azione?";
            modalTitle.className = 'text-xl font-bold text-slate-800 mb-2';
        }

        function hideModal() {
            modal.classList.add('hidden');
        }

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.classList.remove('hidden');
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-white font-bold shadow-xl z-50 transition-all ${isError ? 'bg-red-500' : 'bg-green-600'}`;
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        async function submitCashback() {
            btnConfirm.disabled = true;
            btnConfirm.textContent = 'Invio in corso...';

            try {
                const res = await fetch(`/api/merchant/add-point/${cardId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pendingPayload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Errore server');
                }

                showToast('Card aggiornata! ✅');
                hideModal();
                setTimeout(() => { window.location.reload(); }, 800);

            } catch (e) {
                showToast(e.message, true);
                hideModal();
                btnConfirm.disabled = false;
                btnConfirm.textContent = 'SÌ, CONFERMO';
            }
        }
    </script>
</body>

</html>
