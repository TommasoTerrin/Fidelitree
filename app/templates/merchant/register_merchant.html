<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione Partner - Fidelitree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% include 'partials/pwa.html' %}
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">
    <div class="max-w-sm w-full space-y-6">
        <div class="text-center">
            <img src="/static/logo_stacked.jpg" alt="Fidelitree" class="w-44 mx-auto mb-2 mix-blend-multiply">
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Diventa Partner 🌳</h1>
            <p class="text-slate-500 text-sm mt-2">Carte fedeltà che piantano alberi veri per i tuoi clienti</p>
        </div>

        <form id="register-form" class="space-y-4">
            <input type="text" id="business_name" required
                class="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl text-center focus:border-green-500 focus:outline-none transition-all shadow-sm"
                placeholder="Nome attività (es. Bar Rossi)">

            <input type="email" id="email" required autocomplete="email"
                class="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl text-center focus:border-green-500 focus:outline-none transition-all shadow-sm"
                placeholder="nome@esempio.it">

            <input type="password" id="password" required minlength="8" autocomplete="new-password"
                class="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl text-center tracking-widest focus:border-green-500 focus:outline-none transition-all shadow-sm"
                placeholder="Password (min 8 caratteri)">

            <input type="tel" id="contact_phone"
                class="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl text-center focus:border-green-500 focus:outline-none transition-all shadow-sm"
                placeholder="Telefono di contatto +39... (facoltativo)">

            <div class="bg-green-50 border border-green-200 rounded-2xl p-4">
                <p class="text-xs text-green-700 text-center">
                    Il tuo account sarà attivato per la piantumazione dopo l'approvazione.
                    Puoi iniziare subito a usare le carte.
                </p>
            </div>

            <button type="submit" id="btn-submit"
                class="w-full bg-green-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-transform text-lg">
                REGISTRATI
            </button>

            <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm font-bold p-4 rounded-2xl text-center"></div>
        </form>

        <p class="text-center text-sm text-slate-400">
            Hai già un account? <a href="/merchant/login" class="text-green-600 font-bold underline">Accedi</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const btn = document.getElementById('btn-submit');
        const errorBox = document.getElementById('error-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Registrazione in corso...';

            const phone = document.getElementById('contact_phone').value.trim();
            const payload = {
                business_name: document.getElementById('business_name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                contact_phone: phone || null,
            };

            try {
                const res = await fetch('/merchant/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    const detail = typeof err.detail === 'string'
                        ? err.detail
                        : 'Dati non validi, ricontrolla i campi';
                    throw new Error(detail);
                }

                // Registrazione ok: il cookie di sessione è già impostato
                window.location.href = '/merchant/scanner';
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'REGISTRATI';
            }
        });
    </script>
</body>

</html>
