<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostazioni - Fidelitree</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen p-6 font-sans">
    <div class="max-w-sm mx-auto space-y-6">

        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black text-slate-800">Impostazioni 🌳</h1>
            <a href="/merchant/scanner" class="text-xs bg-slate-900 text-white px-4 py-2 rounded-xl font-bold">Scanner</a>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
            <p class="text-xs text-slate-400 font-bold uppercase mb-1">Attività</p>
            <h2 class="font-black text-lg text-slate-800">{{ merchant.business_name }}</h2>
            <p class="text-sm text-slate-500">{{ merchant.phone_number }}</p>
        </div>

        <form id="settings-form" class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 space-y-5">

            <div class="space-y-3 text-left">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Modalità carte</p>
                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="radio" name="mode" value="trees_cashback" class="mt-1 accent-green-600"
                        {% if merchant.mode == 'trees_cashback' %}checked{% endif %}>
                    <span class="text-sm text-slate-700"><b>Tree points + Cashback</b></span>
                </label>
                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="radio" name="mode" value="trees" class="mt-1 accent-green-600"
                        {% if merchant.mode == 'trees' %}checked{% endif %}>
                    <span class="text-sm text-slate-700"><b>Solo Tree points</b></span>
                </label>
            </div>

            <div>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Punti per piantare 1 albero</p>
                <input type="number" id="tree_threshold" min="1" value="{{ merchant.tree_threshold }}"
                    class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl text-center font-bold focus:border-green-500 focus:outline-none">
            </div>

            <div>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Massimo alberi al mese</p>
                <input type="number" id="monthly_tree_cap" min="0" value="{{ merchant.monthly_tree_cap }}"
                    class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl text-center font-bold focus:border-green-500 focus:outline-none">
                <p class="text-xs text-slate-400 mt-1">Limite di sicurezza sulla tua spesa Ecologi (~0,80 €/albero). 0 = piantumazione sospesa.</p>
            </div>

            <div>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nuova chiave Ecologi (opzionale)</p>
                <input type="text" id="ecologi_api_key" placeholder="Lascia vuoto per non cambiarla"
                    class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl text-center text-sm focus:border-green-500 focus:outline-none">
            </div>

            <button type="submit" id="btn-save"
                class="w-full bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">
                SALVA IMPOSTAZIONI
            </button>
        </form>
    </div>

    <!-- Toast di feedback -->
    <div id="toast"
        class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-white font-bold shadow-xl z-50 transition-all">
    </div>

    <script>
        const form = document.getElementById('settings-form');
        const btn = document.getElementById('btn-save');
        const toast = document.getElementById('toast');

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-2xl text-white font-bold shadow-xl z-50 transition-all ${isError ? 'bg-red-500' : 'bg-green-600'}`;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 4000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Salvataggio...';

            const payload = {
                mode: document.querySelector('input[name="mode"]:checked').value,
                tree_threshold: parseInt(document.getElementById('tree_threshold').value, 10),
                monthly_tree_cap: parseInt(document.getElementById('monthly_tree_cap').value, 10),
            };
            const newKey = document.getElementById('ecologi_api_key').value.trim();
            if (newKey) payload.ecologi_api_key = newKey;

            try {
                const res = await fetch('/api/merchant/me/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(typeof err.detail === 'string' ? err.detail : 'Dati non validi');
                }
                showToast('Impostazioni salvate ✅');
                document.getElementById('ecologi_api_key').value = '';
            } catch (err) {
                showToast(err.message, true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'SALVA IMPOSTAZIONI';
            }
        });
    </script>
</body>

</html>
