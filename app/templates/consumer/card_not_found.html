<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link non valido - Fidelitree</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="robots" content="noindex, nofollow">
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">
    {# La pagina è identica per un token sconosciuto e per uno revocato: non dice se la carta esista. #}
    <div class="max-w-sm w-full space-y-6 text-center">
        <div class="inline-block p-4 bg-white rounded-3xl shadow-sm text-4xl">🍂</div>
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">Link non valido o scaduto</h1>
        <p class="text-slate-500 text-sm">
            Link non valido o scaduto: scrivi {{ keyword }} al negozio su Instagram per riceverne uno nuovo.
        </p>
        <a href="/privacy" class="block text-xs text-slate-400 font-bold uppercase tracking-widest">Privacy</a>
    </div>
</body>

</html>
