<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Fidelitree</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">
    <div class="max-w-sm w-full space-y-8 text-center" data-next="{{ next }}">
        <div>
            <img src="/static/logo_stacked.jpg" alt="Fidelitree" class="w-44 mx-auto mb-2 mix-blend-multiply">
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Accedi a Fidelitree</h1>
            <p id="subtitle" class="text-slate-500 text-sm mt-2">Inserisci la tua email: ti mandiamo un codice monouso</p>
        </div>

        <!-- Passo 1: email -->
        <form id="email-form" class="space-y-4">
            <input type="email" id="email" required autocomplete="email" inputmode="email"
                class="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl text-center text-lg focus:border-green-500 focus:outline-none transition-all shadow-sm"
                placeholder="nome@esempio.it">
            <button type="submit" id="btn-send"
                class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-transform text-lg">
                INVIA CODICE
            </button>
        </form>

        <!-- Passo 2: codice a 6 cifre -->
        <form id="code-form" class="hidden space-y-4">
            <input type="text" id="code" required maxlength="6" autocomplete="one-time-code"
                inputmode="numeric" pattern="[0-9]{6}"
                class="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl text-center text-3xl font-black tracking-[0.5em] focus:border-green-500 focus:outline-none transition-all shadow-sm"
                placeholder="······"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <button type="submit" id="btn-verify"
                class="w-full bg-green-600 text-white font-bold py-5 rounded-2xl shadow-lg active:scale-95 transition-transform text-lg">
                ACCEDI
            </button>
            <button type="button" id="btn-back"
                class="w-full text-slate-400 font-bold py-2 text-sm">
                Cambia email
            </button>
        </form>

        {% if dev_code %}
        <p id="dev-hint" class="text-xs text-yellow-800 bg-yellow-100 border border-yellow-200 rounded-xl py-2 px-3">
            Ambiente di sviluppo — codice di sviluppo: <b>{{ dev_code }}</b>
        </p>
        {% endif %}

        <p class="text-xs text-slate-400 font-medium uppercase tracking-widest">Niente password: basta un codice</p>
    </div>

    {% include 'partials/toast.html' %}

    <script>
        const nextPath = document.querySelector('[data-next]').dataset.next;
        const emailForm = document.getElementById('email-form');
        const codeForm = document.getElementById('code-form');
        const emailInput = document.getElementById('email');
        const codeInput = document.getElementById('code');
        const subtitle = document.getElementById('subtitle');

        // POST JSON; ritorna la risposta o solleva un Error col messaggio del server
        async function postJson(url, payload) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            if (!res.ok) {
                let detail = 'Errore server';
                try {
                    const err = await res.json();
                    detail = typeof err.detail === 'string' ? err.detail : 'Dati non validi';
                } catch (_) { /* risposta non JSON */ }
                throw new Error(detail);
            }
            return res.json();
        }

        function showStep(step) {
            emailForm.classList.toggle('hidden', step !== 'email');
            codeForm.classList.toggle('hidden', step !== 'code');
            subtitle.textContent = step === 'email'
                ? 'Inserisci la tua email: ti mandiamo un codice monouso'
                : `Abbiamo inviato un codice a ${emailInput.value.trim()}`;
            (step === 'email' ? emailInput : codeInput).focus();
        }

        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-send');
            btn.disabled = true;
            try {
                await postJson('/api/customer/otp/request', { email: emailInput.value.trim() });
                codeInput.value = '';
                showStep('code');
            } catch (err) {
                showToast(err.message, true);
            } finally {
                btn.disabled = false;
            }
        });

        codeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-verify');
            btn.disabled = true;
            try {
                await postJson('/api/customer/otp/verify', {
                    email: emailInput.value.trim(),
                    code: codeInput.value.trim(),
                });
                window.location.href = nextPath;
            } catch (err) {
                showToast(err.message, true);
                btn.disabled = false;
            }
        });

        document.getElementById('btn-back').addEventListener('click', () => showStep('email'));
    </script>
</body>

</html>
