name: CI

# Controlli minimi: nessun segreto richiesto (i test usano SQLite in-memory e chiavi finte).
# Il deploy su DigitalOcean NON passa da qui: lo fa App Platform (vedi .agents/workflows/deploy.md).
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # file e non in-memory: main.py configura un pool (pool_size) che SingletonThreadPool non accetta
      DATABASE_URL: "sqlite:///ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    name: build immagine Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: pip-audit (dipendenze)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pip-audit
      # Ignorate (decisione 2026-10-28): python-jose/ecdsa riguardano gli algoritmi a chiave pubblica
      # (confusione di algoritmo con chiavi DER, timing ECDSA P-256), nessun fix disponibile.
      # L'app usa solo HS256 con algorithms=[HS256] fissato (app/core/security.py). Da rivalutare
      # con la migrazione a PyJWT: poi togliere gli --ignore-vuln.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325
